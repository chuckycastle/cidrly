name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default; the release job requests the scopes it needs.
permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Publish secrets can be scoped to this environment and gated by required reviewers
    # (Settings > Environments > release).
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance attestation

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # The tag name is data, never script text: it is passed through env, checked
      # against a semantic-version pattern, and must equal the package.json version.
      - name: Extract and validate version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$REF_NAME' is not a semantic version" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          # Prereleases publish under their own dist-tag so they never become "latest"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            NPM_TAG="$(printf '%s' "${VERSION#*-}" | sed -E 's/[^A-Za-z].*$//')"
            NPM_TAG="${NPM_TAG:-next}"
          else
            PRERELEASE=false
            NPM_TAG=latest
          fi
          {
            echo "VERSION=$VERSION"
            echo "PRERELEASE=$PRERELEASE"
            echo "NPM_TAG=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

      # Lockfile-exact install; dependency lifecycle scripts do not run in the job
      # that holds the publish credentials.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm run test

      - name: Run linter
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production
        run: npm run build:prod

      - name: Check if version exists on npm
        id: check-version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if npm view "cidrly@${VERSION}" version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists on npm, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} does not exist, will publish"
          fi

      - name: Publish to npm (dry-run check)
        if: steps.check-version.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.NPM_TAG }}
        run: npm publish --dry-run --tag "$NPM_TAG"

      - name: Publish to npm
        if: steps.check-version.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.NPM_TAG }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"

      # Download the published tarball, fail on HTTP errors, and check it against
      # the registry's recorded checksum before its SHA-256 goes into the formula.
      - name: Download and verify published tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TARBALL="cidrly-${VERSION}.tgz"
          curl -fsSL "https://registry.npmjs.org/cidrly/-/${TARBALL}" -o "$TARBALL"
          EXPECTED_SHA1="$(npm view "cidrly@${VERSION}" dist.shasum)"
          ACTUAL_SHA1="$(shasum -a 1 "$TARBALL" | awk '{print $1}')"
          if [ -z "$EXPECTED_SHA1" ] || [ "$EXPECTED_SHA1" != "$ACTUAL_SHA1" ]; then
            echo "Tarball checksum $ACTUAL_SHA1 does not match registry shasum $EXPECTED_SHA1" >&2
            exit 1
          fi
          shasum -a 256 "$TARBALL" > SHA256SUMS
          cat SHA256SUMS

      - name: Checkout Homebrew tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chuckycastle/homebrew-cidrly
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TARBALL_URL="https://registry.npmjs.org/cidrly/-/cidrly-${VERSION}.tgz"
          SHA256="$(awk '{print $1}' SHA256SUMS)"

          cd tap
          sed -i.bak "s|url \".*\"|url \"${TARBALL_URL}\"|" Formula/cidrly.rb
          sed -i.bak "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/cidrly.rb
          rm Formula/cidrly.rb.bak

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cidrly.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
          else
            git commit -m "chore: bump cidrly to ${VERSION}"
            git push
          fi

      - name: Generate changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version (VERSION is passed as data, not spliced into awk)
            awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { flag = 1; next } /^## \[/ { flag = 0 } flag' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          files: |
            cidrly-${{ steps.version.outputs.VERSION }}.tgz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
